name: Update IPTV playlist
on:
  push:
    branches: [main]
    paths:
      - 'build_iptv.py'
      - 'build_epg.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: playlist-update
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FFmpeg tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate M3U
        run: python build_iptv.py
      - name: Build XMLTV EPG
        run: python build_epg.py
      - name: Commit updated playlist
        run: |
          git add playlist.m3u IPTV_report.txt IPTV_health.json epg.xml
          if git diff --cached --quiet -- playlist.m3u IPTV_report.txt IPTV_health.json epg.xml; then
            echo "Playlist unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update IPTV playlist"
          # Preserve remote history on conflicts. The generated XMLTV file is
          # independent; the next scheduled run will refresh history if needed.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Remote main advanced; rebasing with upstream conflict preference"
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              git rebase --abort || true
              echo "Could not safely rebase generated output"
              exit 1
            fi
            sleep 2
          done
          echo "Could not push after retries"
          exit 1
            fi
            sleep 2
          done
          echo "Could not push after retries"
          exit 1
