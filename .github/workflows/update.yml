name: Update IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: playlist-update
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate M3U
        run: python build_iptv.py
      - name: Commit updated playlist
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "Playlist unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Update IPTV playlist"
          git push
