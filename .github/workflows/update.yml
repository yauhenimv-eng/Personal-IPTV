name: Update IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: playlist-update
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate M3U
        run: python build_iptv.py
      - name: Commit updated playlist
        run: |
          git add playlist.m3u IPTV_report.txt
          if git diff --cached --quiet -- playlist.m3u IPTV_report.txt; then
            echo "Playlist unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update IPTV playlist"
          git push
